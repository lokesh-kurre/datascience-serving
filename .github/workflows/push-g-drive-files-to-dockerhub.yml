name: Build and Push GDrive Model Image

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive File ID"
        required: true
        type: string
      file_name:
        description: "Output file name (defaults to file ID)"
        required: false
        type: string
      is_folder:
        description: "Is the Google Drive item a folder?"
        required: true
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Set Variables
        run: |
          FILE_ID="${{ inputs.file_id }}"
          FILE_NAME="${{ inputs.file_name || inputs.file_id }}"
          TAG="gdrive-${FILE_ID}"

          echo "FILE_ID=$FILE_ID" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"
          echo "IS_FOLDER=${{ inputs.is_folder }}" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM python:3.10

          ARG FILE_ID
          ARG FILE_NAME
          ARG IS_FOLDER

          ENV FILE_ID=$FILE_ID
          ENV FILE_NAME=$FILE_NAME
          ENV IS_FOLDER=$IS_FOLDER

          RUN pip install --no-cache-dir --progress-bar=off gdown

          RUN mkdir -p /data \
              && if [ "$IS_FOLDER" = "true" ]; then \
                   gdown --folder -O /data "$FILE_ID"; \
                 else \
                   gdown -O /data "$FILE_ID"; \
                 fi \
              && tar -czf "/data-gdrive-$FILE_ID.tar.gz" -C /data . \
              && rm -rf /data/*

          CMD ["sh", "-c", "echo 'Model image ready.' && tar -tf \"/data-gdrive-${FILE_ID}.tar.gz\""]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/test:${{ env.TAG }}
          build-args: |
            FILE_ID=${{ env.FILE_ID }}
            FILE_NAME=${{ env.FILE_NAME }}
            IS_FOLDER=${{ env.IS_FOLDER }}

      - name: Summary
        run: |
          echo "### Image Published ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GDrive File ID | \`${FILE_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| File Name | \`${FILE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Is Folder | \`${IS_FOLDER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Archive | \`data-gdrive-${FILE_ID}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ vars.DOCKERHUB_USERNAME }}/test:${TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
